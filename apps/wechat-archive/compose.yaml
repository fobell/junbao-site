name: wechat-archive
x-app: &app
  image: ${ARCHIVE_IMAGE:-wechat-archive:1.0.0}
  build: { context: ., target: runtime, args: { APP_BASE_PATH: "${APP_BASE_PATH:-}" } }
  restart: unless-stopped
  env_file: .env
  environment: &env
    NODE_ENV: production
    PORT: 3000
    DATA_DIR: /data
    BLOB_OWNER_UID: "1000"
    BLOB_OWNER_GID: "1000"
    DATABASE_URL_FILE: /run/secrets/database_url
    REDIS_URL: redis://redis:6379
    APP_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
    BROWSER_SERVICE_TOKEN_FILE: /run/secrets/browser_token
    BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
    BROWSER_SERVICE_URL: http://browser:3001
    BROWSER_PROXY: http://egress-proxy:3128
    BACKUP_KEY_FILE: /run/secrets/backup_key
  secrets:
    [database_url, encryption_key, browser_token, bootstrap_token, backup_key]
  volumes: [archive_data:/data]
  networks: [core, browser_net, outbound]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }
services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:?Set DOMAIN in .env}" }
    volumes:
      [
        ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro,
        caddy_data:/data,
        caddy_config:/config,
      ]
    networks: [front, outbound]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }
  api:
    <<: *app
    networks: [front, core, browser_net, outbound]
    depends_on:
      {
        db: { condition: service_healthy },
        redis: { condition: service_healthy },
      }
    healthcheck:
      {
        test:
          [
            CMD,
            node,
            -e,
            "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
          ],
        interval: 30s,
        timeout: 5s,
        retries: 3,
      }
  worker:
    <<: *app
    command: [node, dist/server/worker/main.js]
    depends_on:
      {
        db: { condition: service_healthy },
        redis: { condition: service_healthy },
      }
    stop_grace_period: 45s
  browser:
    image: ${BROWSER_IMAGE:-wechat-archive-browser:1.0.0}
    build: { context: ., target: browser, args: { APP_BASE_PATH: "${APP_BASE_PATH:-}" } }
    restart: unless-stopped
    init: true
    user: node
    environment:
      NODE_ENV: production
      BROWSER_SERVICE_TOKEN_FILE: /run/secrets/browser_token
      BROWSER_PROXY: http://egress-proxy:3128
      CHROMIUM_SANDBOX: "true"
    secrets: [browser_token]
    networks: [browser_net]
    shm_size: 1gb
    mem_limit: 3g
    pids_limit: 512
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    security_opt: ["seccomp=./deploy/seccomp_profile.json"]
    depends_on: [egress-proxy]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }
  egress-proxy:
    <<: *app
    env_file: []
    command: [node, dist/server/browser/proxy.js]
    networks: [browser_net, outbound]
    secrets: []
    environment: { NODE_ENV: production }
    volumes: []
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      {
        POSTGRES_USER: archive,
        POSTGRES_DB: archive,
        POSTGRES_PASSWORD_FILE: /run/secrets/database_password,
      }
    secrets: [database_password]
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [core]
    healthcheck:
      {
        test: [CMD-SHELL, "pg_isready -U archive -d archive"],
        interval: 5s,
        timeout: 5s,
        retries: 20,
      }
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }
  redis:
    image: redis:7.4.7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    networks: [core]
    healthcheck:
      { test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 20 }
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }
  ops:
    <<: *app
    profiles: [ops]
    restart: "no"
    user: root
    cap_add: [DAC_OVERRIDE, CHOWN, FOWNER]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: [node, --import, tsx, scripts/migrate.ts]
secrets:
  database_url: { file: ./secrets/database_url }
  database_password: { file: ./secrets/database_password }
  encryption_key: { file: ./secrets/encryption_key }
  browser_token: { file: ./secrets/browser_token }
  bootstrap_token: { file: ./secrets/bootstrap_token }
  backup_key: { file: ./secrets/backup_key }
networks:
  core: { internal: true }
  front: { internal: true }
  browser_net: { internal: true }
  outbound: {}
volumes:
  postgres_data: {}
  redis_data: {}
  archive_data: {}
  caddy_data: {}
  caddy_config: {}
